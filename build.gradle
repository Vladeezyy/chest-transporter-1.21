plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'ChestTransporter-neoforge'
}

repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources.srcDir 'src/generated/resources'

// Tests (src/selftest): loaded in dev runs only, never part of the jar
sourceSets {
    selftest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    selftestImplementation.extendsFrom implementation
    selftestCompileOnly.extendsFrom compileOnly
}

neoForge {
    // -Pneo_version=21.1.197 checks the oldest supported NeoForge
    version = project.findProperty('neo_version')

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // tools/scenetest.sh: client scene with screenshots and checks (src/selftest)
        scene {
            client()
            systemProperty 'chest_transporter.scene', project.findProperty('scene') ?: 'main'
            systemProperty 'chest_transporter.scene.lang', project.findProperty('scene_lang') ?: 'en_us'
        }
        // tools/selftest.sh: functional checks on a fresh world, then stops (src/selftest)
        selftest {
            server()
            programArgument '--nogui'
            systemProperty 'chest_transporter.selftest', 'true'
        }
        // tools/nettest.sh: a dev client joins a dev dedicated server
        netServer {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-net')
        }
        netClient {
            client()
            systemProperty 'chest_transporter.scene', 'net'
            programArguments.addAll('--quickPlayMultiplayer', 'localhost:25565')
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.selftest)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    if (project.hasProperty('with_compat')) {
        localRuntime "maven.modrinth:sodium:${compat_sodium}"
        localRuntime "maven.modrinth:iris:${compat_iris}"
        localRuntime "maven.modrinth:lithium:${compat_lithium}"
        localRuntime "maven.modrinth:ferrite-core:${compat_ferritecore}"
        localRuntime "maven.modrinth:modernfix:${compat_modernfix}"
        localRuntime "maven.modrinth:jade:${compat_jade}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
neoForge.addModdingDependenciesTo(sourceSets.selftest)

tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { 'LICENSE_chest_transporter' } }
    from('licenses') { into 'licenses/chest_transporter' }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
